<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>iframe 内申请表</title>
  <style>
    body { font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 10px 14px; background: #fff; }
    .row { margin: 8px 0; }
    label { display: inline-block; width: 110px; color: #555; }
    input { padding: 6px 8px; border: 1px solid #ccd3dd; border-radius: 4px; width: 220px; }
  </style>
</head>
<body>
  <div class="row"><label for="fr_name">姓名</label><input type="text" id="fr_name" /></div>
  <div class="row"><label for="fr_phone">手机号码</label><input type="text" id="fr_phone" /></div>
  <div class="row"><label for="fr_email">电子邮箱</label><input type="text" id="fr_email" /></div>
</body>
</html>
